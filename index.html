<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Daily Planner</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#4f46e5">
</head>

<body>

    <div class="container">

        <header>
            <h1>📅 My Daily Planner</h1>
            <p>Tell me what you need to do and I'll arrange your day.</p>
        </header>

        <!-- ADD TASK -->
        <section class="card">

            <h2>Add a Task</h2>

            <div class="form-group">
                <label for="taskName">Task name</label>
                <input
                    type="text"
                    id="taskName"
                    placeholder="Example: Study Python"
                >
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="duration">Duration (minutes)</label>
                    <input
                        type="number"
                        id="duration"
                        min="1"
                        placeholder="60"
                    >
                </div>

                <div class="form-group">
                    <label for="priority">Priority</label>

                    <select id="priority">
                        <option value="1">Low</option>
                        <option value="2" selected>Medium</option>
                        <option value="3">High</option>
                    </select>
                </div>

            </div>

            <div class="form-group">

                <label>Task type</label>

                <div class="radio-group">

                    <label>
                        <input
                            type="radio"
                            name="taskType"
                            value="flexible"
                            checked
                        >
                        Flexible
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="taskType"
                            value="fixed"
                        >
                        Fixed time
                    </label>

                </div>

            </div>

            <div
                class="form-group"
                id="fixedTimeContainer"
                style="display:none;"
            >

                <label for="fixedTime">Start time</label>

                <input
                    type="time"
                    id="fixedTime"
                >

            </div>

            <button id="addTaskButton" class="primary-button">
                ➕ Add Task
            </button>

        </section>


        <!-- TODAY'S SCHEDULE -->
        <section class="card">

            <div class="section-header">

                <h2>Today's Schedule</h2>

                <button
                    id="clearButton"
                    class="danger-button"
                >
                    Clear All
                </button>

            </div>

            <div id="warning"></div>

            <div id="schedule"></div>

        </section>

    </div>


    <script src="app.js"></script>

</body>
</html>
